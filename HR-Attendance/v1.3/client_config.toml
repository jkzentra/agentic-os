# client_config.toml
#
# This is the ONE file a new client edits to onboard onto the HR-Attendance
# template. It is a skeleton only: every value below is a placeholder. The
# engine itself reads 03_MASTER_DATA/rules.toml (business rules) and the
# 03_MASTER_DATA/*.csv files (staff, outlets, holidays, roster text labels);
# this file is a convenience reference for setup notes and is not parsed by
# src/ at runtime.

client_name = ""

# Company names used in report tabs, e.g. ["Acme Retail", "Acme Logistics"]
companies = []

# Map of outlet_id -> company name, e.g. { "OUT1" = "Acme Retail" }
outlet_company_map = {}

opening_time = ""
standard_day_hours = 0
weekly_ot_threshold = 0

[data_paths]
roster = ""
punches = ""
output_dir = ""

# Full names (as they appear in 03_MASTER_DATA/staff_map.csv) to exclude from
# attendance entirely, e.g. shareholders/directors who are not staff.
excluded_names = []

# Full names (as they appear in staff_map.csv) who are off-site/WFH with no
# roster by design: punches are shown but no shift checks or OT are applied.
offsite_names = []

# -----------------------------------------------------------------------------
# Agent configuration (used by agents/*.py). Email sender/password live in
# .env (gitignored), never here. Recipients can be edited inline here or
# via the dashboard's Recipients tab.
# -----------------------------------------------------------------------------

[recipients]
# Email addresses that receive the weekly report (Mon 09:00).
weekly = []

# Email addresses that receive the monthly report (1st of month 09:00).
monthly = []

[schedule]
# Daily drop-folder scan time (24h, local time). Default: "12:00".
drop_scan_time = "12:00"

# Weekly report trigger (ISO weekday + 24h time). Default: Monday 09:00.
weekly_day = "Mon"
weekly_time = "09:00"

# Monthly report trigger (day of month + 24h time). Default: 1st of month 09:00.
monthly_day = 1
monthly_time = "09:00"

[week]
# Business week start day. Supported: "Mon" (ISO, default), "Sun", "Sat".
# ask client to confirm; ISO Mon-Sun is the template default.
starts_on = "Mon"
