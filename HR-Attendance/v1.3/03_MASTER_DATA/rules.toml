# rules.toml: attendance rules for this HR-Attendance template.
# Code reads these; nothing is hard-coded in src/. Every rule here is a working
# DEFAULT (status = "ASSUMED") that a new client must confirm or override before
# go-live. To change a rule: edit value/status/source here, run
# `py -m src.rules check`, then rerun the engine.
#
# CONFIRMED needs a non-empty source. ASSUMED = working default, shown amber
# with a "(default; confirm with client)" note in its question/label text.

[meta]
schema_version = 1
allowed_status = ["CONFIRMED", "ASSUMED", "OPEN"]

# ------------------------------------------------------------ rounding & shift rules
[rules.morning_open]
label = "Morning opening time (default; confirm with client)"
value = "10:00"
status = "ASSUMED"
question = "Confirm the outlet/office opening time with the client."
source = ""

[rules.opening_time]
